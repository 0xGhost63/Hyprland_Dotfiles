
animations {
  enabled = yes

  # ─────────────────────────────────────────────
  # BEZIER CURVES
  # ─────────────────────────────────────────────
  bezier = linear,       0.0,  0.0,  1.0,  1.0
  bezier = spring,       0.22, 1.1,  0.22, 1.0     # smooth spring for windows
  bezier = springBounce, 0.15, 1.35, 0.22, 1.0     # bouncy spring for popins
  bezier = easeOut,      0.0,  0.0,  0.2,  1.0
  bezier = easeInOut,    0.85, 0.0,  0.15, 1.0
  bezier = overshot,     0.7,  0.6,  0.1,  1.1
  bezier = menu_decel,   0.1,  1.0,  0.0,  1.0     # launcher pop-scale decel
  bezier = cubeSwitch,   0.45, 0.05, 0.55, 0.95    # cube workspace feel
  bezier = workBounce,   0.34, 1.56, 0.64, 1.0     # springy workspace slide
  bezier = winOut,       0.3, -0.3,  0.0,  1.0

  # ─────────────────────────────────────────────
  # WINDOW OPEN / CLOSE
  # ─────────────────────────────────────────────
  animation = windowsIn,   1, 5, springBounce, popin 75%
  animation = windowsOut,  1, 4, winOut,       popin 60%
  animation = windowsMove, 1, 4, spring,       slide

  # ─────────────────────────────────────────────
  # FADE
  # ─────────────────────────────────────────────
  animation = fade,    1, 5, easeOut
  animation = fadeIn,  1, 4, easeOut
  animation = fadeOut, 1, 4, easeInOut

  # ─────────────────────────────────────────────
  # BORDER GLOW (animated rotation)
  # ─────────────────────────────────────────────
  animation = border,      1, 10, default
  animation = borderangle, 1, 80, linear, loop   # smooth continuous glow sweep

  # ─────────────────────────────────────────────
  # WORKSPACE — cube-face slide effect
  # Combines slidefade with a tight cubic bezier
  # that mimics the side-face of a rotating box
  # ─────────────────────────────────────────────
  animation = workspaces,       1, 5, cubeSwitch, slidefade 25%
  animation = specialWorkspace, 1, 5, menu_decel, slidevert

  # ─────────────────────────────────────────────
  # LAYER SURFACES (Rofi, Waybar, etc.)
  # ─────────────────────────────────────────────
  animation = layers,      1, 3, menu_decel, fade
  animation = layersIn,    1, 3, menu_decel, fade
  animation = layersOut,   1, 2, easeInOut,  fade
}
