
animations {
  enabled = yes

  # ─────────────────────────────────────────────
  # BEZIER CURVES
  # ─────────────────────────────────────────────
  bezier = myBezier,      0.05, 0.9,  0.1,  1.05
  bezier = been,          0.24, 0.9,  0.25, 0.91
  bezier = been2,         0.0,  0.94, 0.5,  0.99
  bezier = menu_decel,    0.1,  1.0,  0.0,  1.0
  bezier = linear,        0.0,  0.0,  1.0,  1.0
  bezier = wind,          0.05, 0.9,  0.1,  1.05
  bezier = winIn,         0.1,  1.1,  0.1,  1.1
  bezier = winOut,        0.3, -0.3,  0.0,  1.0
  bezier = slow,          0.0,  0.85, 0.3,  1.0
  bezier = overshot,      0.7,  0.6,  0.1,  1.1
  bezier = bounce,        1.1,  1.6,  0.1,  0.85
  bezier = slingshot,     1.0, -1.0,  0.15, 1.25
  bezier = nice,          0.25, 1.0,  0.5,  1.0
  bezier = bouncy,        0.05, 0.9,  0.1,  1.15
  bezier = springBounce,  0.15, 1.35, 0.22, 1.0

  # ─────────────────────────────────────────────
  # WINDOW OPEN / CLOSE / MOVE
  # ─────────────────────────────────────────────
  animation = windowsIn,   1, 5, springBounce, popin 80%
  animation = windowsOut,  1, 7, been,         popin 70%
  animation = windowsMove, 1, 5, wind,         slide

  # ─────────────────────────────────────────────
  # BORDER (static — no continuous sweep)
  # ─────────────────────────────────────────────
  animation = border,      0, 10, default
  animation = borderangle, 0, 50, linear, loop

  # ─────────────────────────────────────────────
  # FADE
  # ─────────────────────────────────────────────
  animation = fade,  1, 5, overshot

  # ─────────────────────────────────────────────
  # WORKSPACES — original spring slide (restored)
  # ─────────────────────────────────────────────
  bezier = workspaceBounce, 0.4, 1.5, 0.4, 1
  animation = workspaces,       1, 6, workspaceBounce, slide
  animation = specialWorkspace, 1, 5, menu_decel,      slidevert

  # ─────────────────────────────────────────────
  # WINDOWS (catch-all)
  # ─────────────────────────────────────────────
  animation = windows, 1, 5, bouncy, popin
}
